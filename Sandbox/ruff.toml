# Ruff configuration for the LangGraph Multi-Agent Simulation Framework

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.11+
target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = [
    "E4",    # pycodestyle errors
    "E7",
    "E9",
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "S",     # bandit
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging
]

ignore = [
    "S101",  # Use of assert detected
    "S104",  # Possible binding to all interfaces
    "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
    "T201",  # print found
    "E501",  # Line too long (handled by black)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"tests/**/*.py" = [
    "S101",   # Use of assert in tests is expected
    "S105",   # Hardcoded password in tests is acceptable
    "S106",   # Hardcoded password in tests is acceptable
]

[lint.isort]
known-first-party = ["simulation_framework"]
force-single-line = false
